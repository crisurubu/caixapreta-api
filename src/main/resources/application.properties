# ==========================================================
#   CONFIGURAÇÃO CAIXA-PRETA - AMBIENTE DE TESTE DE CARGA
# ==========================================================

# --- SERVER CONFIG ---
server.port=8080
server.servlet.context-path=

# ? AJUSTE DE SESSÃO (IMPEDE O LOGOUT POR INATIVIDADE DO LADO DO SERVIDOR)
# Define que a sessão no servidor dura 12 horas (720 minutos)
server.servlet.session.timeout=720m
server.servlet.session.cookie.max-age=43200
server.servlet.session.cookie.http-only=true

# --- CONFIGURAÇÃO DO BANCO DE DADOS (H2) ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- AJUSTE DE PERFORMANCE (HIKARI POOL) ---
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.pool-name=HikariPool-CaixaPreta

# --- HIBERNATE & JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# --- H2 CONSOLE ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- SEGURANÇA (JWT & CORS) ---
api.security.token.secret=${JWT_SECRET:caixapreta-secret-key-2026}

# ? AJUSTE DE EXPIRAÇÃO DO TOKEN (O PULO DO GATO)
# Define que o Token JWT gerado vale por 12 horas (em milissegundos)
# 1000 * 60 * 60 * 12 = 43200000
api.security.token.expiration=43200000

# --- LOGGING ---
logging.level.root=INFO
logging.level.com.caixapreta.api=DEBUG